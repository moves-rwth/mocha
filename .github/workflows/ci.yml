name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes graphviz
      - name: Install build frontend
        run: python -m pip install --upgrade build
      - name: Build wheel from source distribution
        run: python -m build
      - name: Install wheel with visualisation support
        shell: bash
        run: |
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[visualization]"
      - name: Run tests against the installed wheel
        run: python -I -m unittest discover -s tests -v

  typecheck:
    name: Type checking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install type checking dependencies
        run: python -m pip install ".[visualization,typecheck]"
      - name: Check library types
        run: python -m mypy

  base-install:
    name: Base installation (without Graphviz)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build frontend
        run: python -m pip install --upgrade build
      - name: Build wheel from source distribution
        run: python -m build
      - name: Install base wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/mocha-base"
          "$RUNNER_TEMP/mocha-base/bin/python" -m pip install dist/*.whl
      - name: Check imports and core algorithms without the Graphviz package
        run: '"$RUNNER_TEMP/mocha-base/bin/python" -I .github/scripts/smoke_base_install.py'

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build and metadata validation tools
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
