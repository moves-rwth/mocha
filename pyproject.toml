[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mocha-model-checking"
version = "0.1.0"
description = "A teaching library for model checking algorithms for labelled transition systems."
readme = "README.md"
authors = [
    { name = "Alexander Bork", email = "alexander.bork@cs.rwth-aachen.de" },
]
license = "MPL-2.0"
license-files = ["LICENCE"]
requires-python = ">=3.11"
keywords = [
    "model-checking",
    "formal-verification",
    "transition-systems",
    "temporal-logic",
    "ltl",
    "teaching",
]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "jsonschema>=4.0",
]

[project.urls]
Repository = "https://github.com/moves-rwth/mocha"
Issues = "https://github.com/moves-rwth/mocha/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mocha" = ["py.typed"]
"mocha.io.schemas" = ["*.json"]

[project.optional-dependencies]
visualization = [
    "graphviz>=0.21",
]
