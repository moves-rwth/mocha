[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mocha"
version = "0.1.0"
description = "A teaching library for model-checking algorithms for labelled transition systems."
readme = "README.md"
authors = [
    { name = "Alexander Bork", email = "alexander.bork@cs.rwth-aachen.de" },
]
license = "MPL-2.0"
license-files = ["LICENCE"]
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
]

[project.urls]
Repository = "https://github.com/moves-rwth/mocha"
Issues = "https://github.com/moves-rwth/mocha/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mocha.io.schemas" = ["*.json"]

[project.optional-dependencies]
visualization = [
    "graphviz>=0.21",
]
typecheck = [
    "mypy>=2.4,<3",
    "types-jsonschema>=4,<5",
]

[tool.mypy]
files = ["src/mocha"]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["graphviz", "graphviz.*"]
# Graphviz 0.21 has partial source annotations but no py.typed marker.
follow_untyped_imports = true
